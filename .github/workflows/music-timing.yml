name: Soundtrack phrase timing
on:
  push:
    branches: ['media/donk-archive-20260917']
    paths: ['.github/workflows/music-timing.yml']
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install -q 'yt-dlp[default]' faster-whisper
      - run: |
          mkdir -p timing
          yt-dlp --no-playlist -f bestaudio/best -o '/tmp/song.%(ext)s' 'https://soundcloud.com/fendy-ghazali/dj-1'
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          source=next(p for p in Path('/tmp').glob('song.*') if p.suffix in ['.m4a','.mp3','.opus','.ogg'])
          segments,info=model.transcribe(str(source),language='zh',beam_size=2,vad_filter=False,condition_on_previous_text=False,word_timestamps=True)
          data=[]
          for s in segments:
              d={'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word} for w in s.words]};data.append(d);print(d['start'],d['end'],d['text'],flush=True)
          Path('timing/phrases.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundtrack-timing
          path: timing/
          retention-days: 3
